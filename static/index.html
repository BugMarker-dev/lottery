<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>财富密码</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #f4f5f7; color: #2b2f36; min-height: 100vh;
  display: flex; justify-content: center;
}
.app { width: 100%; max-width: 720px; padding: 20px 16px 48px; }
header { text-align: center; padding: 18px 0 14px; }
header h1 { font-size: 22px; font-weight: 600; letter-spacing: 1px; }
header p { margin-top: 6px; font-size: 13px; color: #8a9099; }

nav { display: flex; background: #e8eaee; border-radius: 12px; padding: 4px; margin: 12px 0 20px; }
nav button {
  flex: 1; border: 0; background: transparent; padding: 10px 0; font-size: 14px;
  color: #6b7078; border-radius: 9px; cursor: pointer; transition: all .15s;
}
nav button.active { background: #fff; color: #e0453e; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }

.card { background: #fff; border-radius: 14px; padding: 18px; box-shadow: 0 1px 6px rgba(0,0,0,.06); margin-bottom: 16px; }
.card h2 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.card .desc { font-size: 12px; color: #9aa0a8; margin-bottom: 14px; }

.stepper { display: flex; align-items: center; gap: 12px; margin: 12px 0 16px; }
.stepper button {
  width: 36px; height: 36px; border: 1px solid #d8dbe0; background: #fff; border-radius: 10px;
  font-size: 18px; cursor: pointer; color: #444; line-height: 1;
}
.stepper button:active { background: #f0f1f3; }
.stepper input {
  width: 72px; height: 36px; text-align: center; font-size: 16px; border: 1px solid #d8dbe0;
  border-radius: 10px; outline: none; -moz-appearance: textfield;
}
.stepper input::-webkit-inner-spin-button { display: none; }
.stepper .unit { font-size: 13px; color: #8a9099; }

.btn-main {
  width: 100%; border: 0; background: #e0453e; color: #fff; font-size: 15px; font-weight: 600;
  padding: 12px 0; border-radius: 12px; cursor: pointer; letter-spacing: 2px;
}
.btn-main:active { opacity: .85; }
.btn-main:disabled { opacity: .5; cursor: default; }
.btn-blue { background: #2f6fd6; }

.tickets { margin-top: 16px; }
.ticket {
  display: flex; align-items: center; padding: 12px 10px; border-top: 1px solid #f0f1f3;
}
.ticket .idx { width: 34px; font-size: 12px; color: #9aa0a8; flex-shrink: 0; }
.balls { display: flex; flex-wrap: wrap; gap: 6px; }
.ball {
  width: 32px; height: 32px; border-radius: 50%; color: #fff; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: center;
}
.ball.front { background: #e0453e; }
.ball.back { background: #2f6fd6; }
.divider { width: 14px; flex-shrink: 0; }

.banner { padding: 10px 14px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
.banner.err { background: #fdeeee; color: #c0392b; }
.banner.info { background: #eef4fd; color: #2f6fd6; }

.range-switch { display: flex; gap: 8px; margin-bottom: 14px; }
.range-switch button {
  border: 1px solid #d8dbe0; background: #fff; padding: 6px 14px; border-radius: 20px;
  font-size: 12px; color: #6b7078; cursor: pointer;
}
.range-switch button.active { background: #2b2f36; color: #fff; border-color: #2b2f36; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  display: flex; align-items: center; gap: 7px; padding: 6px 10px; border-radius: 10px;
  background: #f7f8fa; font-size: 12px;
}
.chip .ball { width: 26px; height: 26px; font-size: 12px; }
.chip .meta { line-height: 1.3; }
.chip .meta b { font-size: 12px; }
.chip .meta span { display: block; color: #9aa0a8; font-size: 11px; }
.side-title { font-size: 13px; font-weight: 600; color: #6b7078; margin: 14px 0 8px; }

.record { display: flex; align-items: center; padding: 11px 4px; border-top: 1px solid #f0f1f3; flex-wrap: wrap; gap: 6px; }
.record:first-child { border-top: 0; }
.record .info { width: 118px; flex-shrink: 0; }
.record .info b { font-size: 13px; display: block; }
.record .info span { font-size: 11px; color: #9aa0a8; }

.empty { text-align: center; color: #9aa0a8; font-size: 13px; padding: 26px 0; }

/* 保留 / 待打票 */
.pin {
  margin-left: auto; width: 30px; height: 30px; flex-shrink: 0; border-radius: 50%;
  border: 1px solid #d8dbe0; background: #fff; color: #b6bbc3; font-size: 15px; line-height: 1;
  display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all .15s;
}
.pin:hover { border-color: #b6bbc3; color: #6b7078; }
.pin.on, .pin.on:hover { background: #e0453e; border-color: #e0453e; color: #fff; }
.pin.on.blue { background: #2f6fd6; border-color: #2f6fd6; }

.pinbar {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; z-index: 30;
  display: flex; align-items: center; gap: 14px; padding: 11px 20px; border: 0; border-radius: 22px;
  background: #23272e; color: #fff; font-size: 13px; cursor: pointer; box-shadow: 0 6px 22px rgba(0,0,0,.22);
}
.pinbar b { font-size: 15px; margin: 0 2px; }
.pinbar .go { opacity: .7; }

.mask { position: fixed; inset: 0; background: rgba(20,22,26,.42); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 20px; }
.sheet { width: 100%; max-width: 440px; max-height: 76vh; background: #fff; border-radius: 16px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
.sheet-hd { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 12px; border-bottom: 1px solid #f0f1f3; }
.sheet-hd b { font-size: 15px; }
.sheet-hd button { border: 0; background: transparent; color: #9aa0a8; font-size: 13px; cursor: pointer; }
.sheet-bd { flex: 1; overflow-y: auto; padding: 2px 18px; }
.sheet-ft { display: flex; gap: 10px; padding: 12px 18px 16px; border-top: 1px solid #f0f1f3; }
.sheet-ft button { flex: 1; border: 0; border-radius: 10px; padding: 11px 0; font-size: 14px; font-weight: 600; cursor: pointer; }
.sheet-ft .ghost { background: #f2f3f5; color: #5f646c; }
.sheet-ft .solid { background: #e0453e; color: #fff; }
.bill { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid #f0f1f3; }
.bill:first-child { border-top: 0; }
.bill .no { width: 24px; font-size: 12px; color: #9aa0a8; flex-shrink: 0; }
.bill .balls { flex: 1; }
.bill .ball { width: 28px; height: 28px; font-size: 12px; }
.bill .del { width: 26px; height: 26px; flex-shrink: 0; border: 0; border-radius: 8px; background: #f5f6f8; color: #9aa0a8; font-size: 15px; cursor: pointer; }

.toast {
  position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(8px);
  background: rgba(35,39,46,.92); color: #fff; font-size: 12px; padding: 8px 16px; border-radius: 20px;
  opacity: 0; pointer-events: none; transition: all .22s; z-index: 60;
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
.spin { display: inline-block; width: 14px; height: 14px; border: 2px solid #d8dbe0; border-top-color: #e0453e; border-radius: 50%; animation: r .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
@keyframes r { to { transform: rotate(360deg); } }
.disclaimer { font-size: 11px; color: #b0b5bd; text-align: center; margin-top: 22px; line-height: 1.6; }
</style>
</head>
<body>
<div id="app" class="app">
  <header>
    <h1>财富密码</h1>
    <p>前区 01-35 选 5 个 &nbsp;·&nbsp; 后区 01-12 选 2 个</p>
  </header>

  <nav>
    <button v-for="t in tabs" :key="t.key" :class="{active: tab===t.key}" @click="switchTab(t.key)">{{ t.label }}</button>
  </nav>

  <div v-if="error" class="banner err">{{ error }}</div>

  <!-- 随机 -->
  <template v-if="tab==='random'">
    <div class="card">
      <h2>随机选号</h2>
      <div class="desc">纯随机，每注概率完全相同</div>
      <div class="stepper">
        <button @click="count = Math.max(1, count-1)">−</button>
        <input type="number" v-model.number="count" min="1" max="1000">
        <button @click="count = Math.min(1000, count+1)">＋</button>
        <span class="unit">注（1-1000）</span>
      </div>
      <button class="btn-main" :disabled="loading" @click="generate('random')">
        {{ loading ? '生成中...' : '生成随机号码' }}
      </button>
      <div class="tickets" v-if="randomTickets.length">
        <div class="ticket" v-for="(t,i) in randomTickets" :key="'r'+i">
          <span class="idx">第{{ i+1 }}注</span>
          <div class="balls">
            <span class="ball front" v-for="n in t.front" :key="'f'+n">{{ pad(n) }}</span>
            <span class="divider"></span>
            <span class="ball back" v-for="n in t.back" :key="'b'+n">{{ pad(n) }}</span>
          </div>
          <button class="pin" :class="{on: isPinned(t)}" :aria-pressed="isPinned(t)"
                  :aria-label="isPinned(t) ? '取消保留' : '保留这注'"
                  @click="togglePin(t,'random')">{{ isPinned(t) ? '✓' : '＋' }}</button>
        </div>
      </div>
    </div>
  </template>

  <!-- 预测 -->
  <template v-if="tab==='predict'">
    <div class="card">
      <h2>热号预测</h2>
      <div class="desc" v-if="predictTickets.length && predictTotal">
        基于最近 {{ predictTotal }} 期数据 · 全局频率 40% + 近 30 期频率 60% 加权
      </div>
      <div class="desc" v-else>基于历史开奖数据的热号加权抽样</div>
      <div class="stepper">
        <button @click="pCount = Math.max(1, pCount-1)">−</button>
        <input type="number" v-model.number="pCount" min="1" max="1000">
        <button @click="pCount = Math.min(1000, pCount+1)">＋</button>
        <span class="unit">注（1-1000）</span>
      </div>
      <button class="btn-main btn-blue" :disabled="loading" @click="generate('predict')">
        {{ loading ? '生成中...' : '生成预测号码' }}
      </button>
      <div class="tickets" v-if="predictTickets.length">
        <div class="ticket" v-for="(t,i) in predictTickets" :key="'p'+i">
          <span class="idx">第{{ i+1 }}注</span>
          <div class="balls">
            <span class="ball front" v-for="n in t.front" :key="'f'+n">{{ pad(n) }}</span>
            <span class="divider"></span>
            <span class="ball back" v-for="n in t.back" :key="'b'+n">{{ pad(n) }}</span>
          </div>
          <button class="pin blue" :class="{on: isPinned(t)}" :aria-pressed="isPinned(t)"
                  :aria-label="isPinned(t) ? '取消保留' : '保留这注'"
                  @click="togglePin(t,'predict')">{{ isPinned(t) ? '✓' : '＋' }}</button>
        </div>
      </div>
    </div>
  </template>

  <!-- 统计 -->
  <template v-if="tab==='stats'">
    <div class="card">
      <h2>号码统计</h2>
      <div class="desc" v-if="stats">基于最近 {{ stats.total }} 期开奖数据</div>
      <div class="range-switch">
        <button :class="{active: statRange==='global'}" @click="statRange='global'">全部 {{ stats ? stats.total : '' }} 期</button>
        <button :class="{active: statRange==='recent'}" @click="statRange='recent'">近 {{ stats ? stats.recentN : 30 }} 期</button>
      </div>
      <template v-if="stats">
        <div class="side-title">前区热号（红）</div>
        <div class="chips">
          <div class="chip" v-for="s in stats.front[statRange].slice(0,15)" :key="'f'+s.num">
            <span class="ball front" :style="{opacity: 0.45 + 0.55*s.count/maxCount}">{{ pad(s.num) }}</span>
            <span class="meta"><b>{{ s.count }}次</b><span>{{ s.pct }}%</span></span>
          </div>
        </div>
        <div class="side-title">后区热号（蓝）</div>
        <div class="chips">
          <div class="chip" v-for="s in stats.back[statRange]" :key="'b'+s.num">
            <span class="ball back" :style="{opacity: 0.45 + 0.55*s.count/maxCount}">{{ pad(s.num) }}</span>
            <span class="meta"><b>{{ s.count }}次</b><span>{{ s.pct }}%</span></span>
          </div>
        </div>
      </template>
      <div v-else class="empty"><span class="spin"></span>加载统计中...</div>
    </div>
  </template>

  <!-- 记录 -->
  <template v-if="tab==='recent'">
    <div class="card">
      <h2>最近开奖</h2>
      <div class="desc">数据来自体彩官方接口</div>
      <template v-if="recent.length">
        <div class="record" v-for="r in recent" :key="r.issue">
          <div class="info"><b>第 {{ r.issue }} 期</b><span>{{ r.date }}</span></div>
          <div class="balls">
            <span class="ball front" v-for="n in r.front" :key="'f'+n">{{ pad(n) }}</span>
            <span class="divider"></span>
            <span class="ball back" v-for="n in r.back" :key="'b'+n">{{ pad(n) }}</span>
          </div>
        </div>
      </template>
      <div v-else class="empty"><span class="spin"></span>加载开奖记录中...</div>
    </div>
  </template>

  <button v-if="pinned.length" class="pinbar" @click="showPins = true">
    <span>待打票 <b>{{ pinned.length }}</b> 注</span>
    <span class="go">查看清单 ›</span>
  </button>

  <div v-if="showPins" class="mask" @click.self="showPins = false">
    <div class="sheet">
      <div class="sheet-hd">
        <b>待打票 {{ pinned.length }} 注</b>
        <button @click="showPins = false">关闭</button>
      </div>
      <div class="sheet-bd">
        <div v-if="!pinned.length" class="empty">还没有保留的号码<br>在号码右侧点 ＋ 就能加进来</div>
        <div class="bill" v-for="(x,i) in pinned" :key="'pin'+i">
          <span class="no">{{ i+1 }}</span>
          <div class="balls">
            <span class="ball front" v-for="n in x.f" :key="'f'+n">{{ pad(n) }}</span>
            <span class="divider"></span>
            <span class="ball back" v-for="n in x.b" :key="'b'+n">{{ pad(n) }}</span>
          </div>
          <button class="del" @click="removePin(i)" aria-label="删除这注">×</button>
        </div>
      </div>
      <div class="sheet-ft">
        <button class="ghost" @click="clearPins">清空</button>
        <button class="solid" @click="copyPins">复制文本</button>
      </div>
    </div>
  </div>

  <div class="toast" :class="{on: !!tip}">{{ tip }}</div>

  <p class="disclaimer">
    号码仅供娱乐，开奖为独立随机事件，历史数据不构成任何中奖概率优势。<br>
    请理性购彩 · 未满 18 周岁禁止购彩
  </p>
</div>

<script src="/vue.global.prod.js"></script>
<script>
const { createApp } = Vue;

createApp({
  data() {
    return {
      tabs: [
        { key: 'random', label: '随机' },
        { key: 'predict', label: '预测' },
        { key: 'stats', label: '统计' },
        { key: 'recent', label: '记录' }
      ],
      tab: 'random',
      count: 5,
      pCount: 3,
      randomTickets: [],
      predictTickets: [],
      predictTotal: 0,
      loading: false,
      error: '',
      stats: null,
      statRange: 'global',
      recent: [],
      pinned: [],       // 待打票清单，存 localStorage，与手机版共用
      showPins: false,
      tip: ''
    };
  },
  created() {
    try {
      const arr = JSON.parse(localStorage.getItem('dlt_pinned_v1') || '[]');
      if (Array.isArray(arr)) {
        this.pinned = arr.filter(x => x && Array.isArray(x.f) && x.f.length === 5
                                     && Array.isArray(x.b) && x.b.length === 2);
      }
    } catch (e) { /* 数据损坏就当空清单 */ }
  },
  watch: {
    pinned: {
      deep: true,
      handler(v) {
        try { localStorage.setItem('dlt_pinned_v1', JSON.stringify(v)); } catch (e) { /* 忽略 */ }
      }
    }
  },
  computed: {
    maxCount() {
      const side = this.statRange === 'recent'
        ? this.stats.front.recent
        : this.stats.front.global;
      return Math.max(...side.map(s => s.count), 1);
    }
  },
  methods: {
    pad(n) { return String(n).padStart(2, '0'); },

    // —— 待打票清单 ——
    pinKey(t) { return t.front.join(',') + '|' + t.back.join(','); },

    isPinned(t) {
      const k = this.pinKey(t);
      return this.pinned.some(x => x.f.join(',') + '|' + x.b.join(',') === k);
    },

    togglePin(t, src) {
      const k = this.pinKey(t);
      const i = this.pinned.findIndex(x => x.f.join(',') + '|' + x.b.join(',') === k);
      if (i >= 0) { this.pinned.splice(i, 1); return; }
      if (this.pinned.length >= 50) { this.showTip('清单最多 50 注，请先清空'); return; }
      this.pinned.push({ f: t.front.slice(), b: t.back.slice(), src: src, ts: Date.now() });
      this.showTip('已保留，共 ' + this.pinned.length + ' 注');
    },

    removePin(i) { this.pinned.splice(i, 1); },

    clearPins() {
      if (!this.pinned.length) return;
      if (!confirm('清空待打票清单？共 ' + this.pinned.length + ' 注')) return;
      this.pinned = [];
      this.showTip('已清空');
    },

    pinText() {
      return this.pinned
        .map(x => x.f.map(n => this.pad(n)).join(' ') + '  +  ' + x.b.map(n => this.pad(n)).join(' '))
        .join('\n');
    },

    async copyPins() {
      if (!this.pinned.length) { this.showTip('清单是空的'); return; }
      const text = this.pinText();
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          await navigator.clipboard.writeText(text);
        } else {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
          document.body.appendChild(ta);
          ta.select(); document.execCommand('copy');
          document.body.removeChild(ta);
        }
        this.showTip('已复制 ' + this.pinned.length + ' 注');
      } catch (e) {
        this.showTip('复制失败，请手动选择');
      }
    },

    showTip(msg) {
      this.tip = msg;
      clearTimeout(this._tipTimer);
      this._tipTimer = setTimeout(() => { this.tip = ''; }, 1600);
    },

    async api(path) {
      const res = await fetch(path);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
      return data;
    },

    switchTab(key) {
      this.tab = key;
      if (key === 'stats' && !this.stats) this.loadStats();
      if (key === 'recent' && !this.recent.length) this.loadRecent();
    },

    async generate(mode) {
      const n = mode === 'random' ? this.count : this.pCount;
      if (!Number.isInteger(n) || n < 1 || n > 1000) {
        this.error = '注数必须是 1-1000 的整数';
        return;
      }
      this.error = '';
      this.loading = true;
      try {
        const path = mode === 'predict' ? '/api/predict' : '/api/generate';
        const data = await this.api(path + '?count=' + n);
        if (mode === 'random') {
          this.randomTickets = data.tickets;
        } else {
          this.predictTickets = data.tickets;
          if (data.total) this.predictTotal = data.total;
        }
      } catch (e) {
        this.error = '生成失败：' + e.message;
      } finally {
        this.loading = false;
      }
    },

    async loadStats() {
      try {
        this.stats = await this.api('/api/stats');
      } catch (e) {
        this.error = '统计加载失败：' + e.message;
      }
    },

    async loadRecent() {
      try {
        const data = await this.api('/api/recent?count=15');
        this.recent = data.records;
      } catch (e) {
        this.error = '记录加载失败：' + e.message;
      }
    }
  }
}).mount('#app');
</script>
</body>
</html>
